[build-system]
requires = [
  "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "movieEditor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "moviepy>=1.0.3",
    "numpy>=1.24.0"
] 
[project.optional-dependencies]
dev = [
  "pytest",
  "black"
]
